name: plagia-tolima-enterprise

services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: plagia-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: plagia
      POSTGRES_PASSWORD: plagia_secret
      POSTGRES_DB: plagia_geo
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plagia -d plagia_geo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: plagia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: plagia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: plagia_admin
      MINIO_ROOT_PASSWORD: plagia_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plagia-mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow_data/mlflow.db
      --default-artifact-root /mlflow_data/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow_data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plagia-api
    restart: unless-stopped
    environment:
      PLAGIA_ENV: production
      PLAGIA_USE_CUDA: "true"
      PLAGIA_DATABASE_URL: postgresql+psycopg2://plagia:plagia_secret@postgis:5432/plagia_geo
      PLAGIA_REDIS_URL: redis://redis:6379/0
      PLAGIA_CELERY_EAGER_FALLBACK: "false"
      PLAGIA_MINIO_ENDPOINT: minio:9000
      PLAGIA_MLFLOW_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./artifacts:/app/artifacts
      - ./dataset:/app/dataset:ro
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plagia-celery-worker
    restart: unless-stopped
    command: celery -A backend.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      PLAGIA_ENV: production
      PLAGIA_USE_CUDA: "true"
      PLAGIA_DATABASE_URL: postgresql+psycopg2://plagia:plagia_secret@postgis:5432/plagia_geo
      PLAGIA_REDIS_URL: redis://redis:6379/0
      PLAGIA_CELERY_EAGER_FALLBACK: "false"
      PLAGIA_MINIO_ENDPOINT: minio:9000
    volumes:
      - ./models:/app/models
      - ./artifacts:/app/artifacts
      - ./dataset:/app/dataset:ro
    depends_on:
      redis:
        condition: service_healthy
      postgis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plagia-frontend
    restart: unless-stopped
    environment:
      PORT: "3000"
      PLAGIA_API_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgis_data:
  redis_data:
  minio_data:
  mlflow_data:
