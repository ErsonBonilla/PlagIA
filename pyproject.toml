[project]
name = "plagia-enterprise"
version = "1.0.0"
description = "Plataforma Empresarial de Vigilancia Fitosanitaria y Agricultura de Precision para el Cultivo de Arroz en el Tolima"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "ultralytics>=8.3.0",
    "onnx>=1.17.0",
    "onnxscript>=0.1.0",
    "onnxruntime-gpu>=1.20.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "opencv-python-headless>=4.10.0",
    "albumentations>=1.4.0",
    "pillow>=10.4.0",
    "numpy>=1.26.4,<2.2.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "rasterio>=1.4.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.35",
    "geoalchemy2>=0.15.2",
    "psycopg2-binary>=2.9.9",
    "minio>=7.2.9",
    "mlflow>=2.17.0",
    "pyspark>=3.5.3",
    "httpx>=0.27.2",
    "pytest>=8.3.3",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml_engine", "backend"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
